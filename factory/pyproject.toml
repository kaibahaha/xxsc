[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agl"
version = "4.2.0r1"
description = "Agensh-Lite V4.2 adapter plane (M02 GitHub storage, M06 poll/agent adapters, M08 executor bridge, M10 CLI)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agl = "agl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "mock: test uses simulated transport/provider, not a real cross-platform connection",
    "real_git: test executes real git plumbing against a local bare repository",
    "network: test requires outbound network access to api.github.com",
]
