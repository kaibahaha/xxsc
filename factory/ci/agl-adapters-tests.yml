name: agl-adapters-tests

# Adapter-plane CI. Deliberately NOT scheduled: no cron, no deployment, no paid
# service. Runs on pull requests into the workorder baseline and by hand.
on:
  pull_request:
    paths:
      - "factory/**"
      - "factory/ci/agl-adapters-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e factory
      - name: Unit + integration (local bare git, no credentials)
        working-directory: factory
        run: python -m pytest tests -q -m "not network"
      - name: Config preflight
        working-directory: factory
        run: |
          python -m agl.cli validate-config --config config/pool_n6.valid.json
          python -m agl.cli plan-schedules --config config/pool_n6.valid.json --json > /tmp/schedule_manifest.json
          cat /tmp/schedule_manifest.json
